name: Reel Counter APK

on:
  push:
    paths:
      - "reel_counter/**"
      - ".github/workflows/reel-counter-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reel_counter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk ReelCounter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelCounter-apk
          path: reel_counter/ReelCounter.apk

      # On main, also attach the APK to a release so it can be downloaded from the phone without logging in.
      - name: Publish to the "Reel Counter (latest)" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reel-counter-latest
          name: Reel Counter (latest)
          body: |
            Download **ReelCounter.apk** below, open it on your Android phone and allow "Install unknown apps".
            Then open Reel Counter and follow the "Turn on counting" steps.
          files: reel_counter/ReelCounter.apk
          make_latest: true
